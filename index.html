<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E.V. AI • Full OS Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; user-select:none; -webkit-tap-highlight-color:transparent; }
    body { width:100vw; height:100dvh; overflow:hidden; background:#02050e; color:#e2e8f0; font-family:system-ui,sans-serif; position:fixed; }
    #c-box { position:absolute; inset:0; z-index:1; }
    .hud { position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(circle at 50% 50%, transparent 25%, #02050e 95%); }
  </style>
</head>
<body class="flex flex-col justify-between p-3.5 max-w-md mx-auto">
  <div id="c-box"></div><div class="hud"></div>

  <!-- HIDDEN OS HARDWARE BRIDGES -->
  <input type="file" id="cam-bridge" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="gal-bridge" accept="image/*,video/*" class="hidden">

  <!-- HEADER -->
  <header class="relative z-10 flex flex-col gap-1.5">
    <div class="flex items-center gap-1.5">
      <div id="hud" class="flex-1 bg-[#040b18]/85 border border-[#ff1744] px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-md">
        <span id="dot" class="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_8px_#ff1744]"></span>
        <span id="st-txt" class="text-[10px] font-bold tracking-wider uppercase truncate">E.V. CORE OFFLINE</span>
      </div>
      <button onclick="$('key-bar').classList.toggle('hidden')" class="bg-[#040b18]/80 border border-[#ff1744]/70 text-[#ff1744] px-3 py-1.5 rounded-full text-[10px] font-bold">SETUP</button>
    </div>
    <div id="key-bar" class="hidden flex gap-1.5 bg-[#040b18]/95 border border-cyan-500/40 p-2 rounded-xl backdrop-blur-md">
      <input id="name-in" placeholder="Name" class="w-1/3 bg-black/60 border border-[#ff1744]/40 rounded-lg px-2 py-1 text-xs text-white outline-none">
      <input id="key-in" type="password" placeholder="Optional Groq/Gemini Key" class="flex-1 bg-black/60 border border-cyan-500/40 rounded-lg px-2 py-1 text-xs text-white outline-none">
      <button onclick="save()" class="bg-[#ff1744] text-white text-[10px] font-bold px-2.5 rounded-lg">SAVE</button>
    </div>
  </header>

  <!-- WORKSPACE & SUBTITLES -->
  <main class="relative z-10 flex flex-col justify-end gap-2 pointer-events-none my-auto w-full">
    <div id="workspace" class="hidden pointer-events-auto max-h-[28dvh] bg-[#030916]/95 border border-cyan-500/40 rounded-xl p-2.5 overflow-y-auto text-[11px] font-mono text-cyan-300"></div>
    <div class="pointer-events-auto bg-[#040b18]/85 border border-cyan-500/30 rounded-xl p-2.5 backdrop-blur-md">
      <div class="flex justify-between text-[9px] font-bold tracking-widest text-[#ff1744] uppercase mb-0.5">
        <span id="u-tag">E.V. LIVE NEURAL AI</span><span id="badge" class="text-cyan-400">OFF</span>
      </div>
      <p id="sub" class="text-xs text-slate-100 line-clamp-2">"Tap below to initialize."</p>
      <a id="app-btn" href="#" class="hidden mt-2 inline-flex items-center justify-center bg-gradient-to-r from-cyan-600 to-blue-600 text-white text-xs font-bold py-2 px-3 rounded-lg w-full transition active:scale-95 shadow-lg">🚀 Launch App</a>
    </div>
  </main>

  <!-- CONTROLS -->
  <footer class="relative z-10 flex flex-col gap-1.5">
    <div class="flex gap-1.5">
      <button id="mic" onclick="toggleMic()" class="flex-1 bg-gradient-to-r from-[#ff1744]/30 to-cyan-500/30 border-2 border-[#ff1744] text-white py-3 rounded-full text-xs font-bold tracking-widest uppercase active:scale-95 transition">TAP TO LINK</button>
      <button onclick="$('chat-form').classList.toggle('hidden')" class="bg-[#050d1f] border border-cyan-400/50 text-cyan-300 px-3.5 rounded-full text-xs">⌨️</button>
    </div>
    <form id="chat-form" onsubmit="event.preventDefault(); askEV($('chat-in').value); $('chat-in').value='';" class="hidden flex gap-1.5">
      <input id="chat-in" placeholder="Say 'open camera', 'open instagram', 'call 123'..." class="flex-1 bg-[#040b18] border border-cyan-400/50 rounded-full px-3 py-1.5 text-xs text-white outline-none">
      <button class="bg-[#ff1744] text-white text-[10px] font-bold px-3 rounded-full">SEND</button>
    </form>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    let KEY = localStorage.getItem('ev_k') || "", NAME = localStorage.getItem('ev_n') || "", state = "OFF";
    const isDroid = /android/i.test(navigator.userAgent);
    $('key-in').value = KEY; $('name-in').value = NAME;
    const syncTag = () => $('u-tag').innerText = NAME ? `E.V. // ${NAME.toUpperCase()}` : "E.V. SYSTEM";
    syncTag();

    function save() {
      KEY = $('key-in').value.trim(); NAME = $('name-in').value.trim();
      localStorage.setItem('ev_k', KEY); localStorage.setItem('ev_n', NAME);
      syncTag(); $('key-bar').classList.add('hidden');
    }

    // --- COMPLETE A-Z OS & APP INTENT ENGINE ---
    const APPS = {
      // Hardware & System Tools
      camera: () => { $('cam-bridge').click(); return { n: "Camera", u: null }; },
      calculator: () => ({ n: "Calculator", u: isDroid ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_CALCULATOR;end" : "https://www.google.com/search?q=calculator" }),
      settings: () => ({ n: "Settings", u: isDroid ? "intent:#Intent;action=android.settings.SETTINGS;end" : "app-settings:" }),
      clock: () => ({ n: "Clock & Alarms", u: isDroid ? "intent:#Intent;action=android.intent.action.SHOW_ALARMS;end" : "clock-alarm:" }),
      alarm: () => ({ n: "Alarm", u: isDroid ? "intent:#Intent;action=android.intent.action.SHOW_ALARMS;end" : "clock-alarm:" }),
      calendar: () => ({ n: "Calendar", u: isDroid ? "content://com.android.calendar/time/" : "calshow:" }),
      gallery: () => { $('gal-bridge').click(); return { n: "Photos", u: isDroid ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_GALLERY;end" : "photos-redirect:" }; },
      photos: () => { $('gal-bridge').click(); return { n: "Photos", u: isDroid ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_GALLERY;end" : "photos-redirect:" }; },
      files: () => ({ n: "File Manager", u: isDroid ? "intent:#Intent;action=android.intent.action.OPEN_DOCUMENT;type=*/*;end" : "shareddocuments:" }),
      call: (p) => ({ n: "Dialer", u: "tel:" + (p.match(/\d+/)?.[0] || "") }),
      phone: (p) => ({ n: "Dialer", u: "tel:" + (p.match(/\d+/)?.[0] || "") }),
      dialer: (p) => ({ n: "Dialer", u: "tel:" + (p.match(/\d+/)?.[0] || "") }),
      sms: () => ({ n: "Messages", u: "sms:" }),
      messages: () => ({ n: "Messages", u: "sms:" }),

      // Popular A-Z Deep Links
      amazon: () => ({ n: "Amazon", u: "amazon://" }),
      chrome: () => ({ n: "Chrome", u: "googlechrome://" }),
      discord: () => ({ n: "Discord", u: "discord://" }),
      facebook: () => ({ n: "Facebook", u: "fb://" }),
      github: () => ({ n: "GitHub", u: "https://github.com" }),
      gmail: () => ({ n: "Gmail", u: "googlegmail://" }),
      mail: () => ({ n: "Mail", u: "mailto:" }),
      instagram: () => ({ n: "Instagram", u: "instagram://" }),
      linkedin: () => ({ n: "LinkedIn", u: "linkedin://" }),
      maps: (p) => ({ n: "Google Maps", u: p ? `https://www.google.com/maps/search/${encodeURIComponent(p)}` : "https://maps.google.com" }),
      netflix: () => ({ n: "Netflix", u: "nflx://" }),
      paytm: () => ({ n: "Paytm", u: "paytmmp://" }),
      phonepe: () => ({ n: "PhonePe", u: "phonepe://" }),
      pinterest: () => ({ n: "Pinterest", u: "pinterest://" }),
      playstore: () => ({ n: "Play Store", u: "market://" }),
      reddit: () => ({ n: "Reddit", u: "reddit://" }),
      snapchat: () => ({ n: "Snapchat", u: "snapchat://" }),
      spotify: (p) => ({ n: "Spotify", u: p ? `https://open.spotify.com/search/${encodeURIComponent(p)}` : "spotify://" }),
      telegram: () => ({ n: "Telegram", u: "tg://resolve" }),
      tiktok: () => ({ n: "TikTok", u: "tiktok://" }),
      twitter: () => ({ n: "Twitter / X", u: "twitter://" }),
      uber: () => ({ n: "Uber", u: "uber://" }),
      whatsapp: (p) => ({ n: "WhatsApp", u: p ? `whatsapp://send?text=${encodeURIComponent(p)}` : "whatsapp://" }),
      youtube: (p) => ({ n: "YouTube", u: p ? `https://www.youtube.com/results?search_query=${encodeURIComponent(p)}` : "https://www.youtube.com" }),
      zomato: () => ({ n: "Zomato", u: "zomato://" })
    };

    function resolveApp(q) {
      const clean = q.toLowerCase().replace(/^(open|launch|start|run|play|search)\s+(for\s+)?/i, "").trim();
      const tokens = clean.split(/\s+/);
      const target = tokens[0];
      const param = tokens.slice(1).join(" ");

      // 1. Direct registry lookup
      for (const key in APPS) {
        if (clean.includes(key)) return APPS[key](param || clean.replace(key, "").trim());
      }

      // 2. Fallback for ANY unknown App A to Z (Attempts Package intent / Store)
      if (/^(open|launch|start|run)\b/i.test(q) && target.length > 1) {
        const title = target.charAt(0).toUpperCase() + target.slice(1);
        const url = isDroid ? `intent:#Intent;package=com.${target};end` : `https://${target}.com`;
        return { n: title, u: url, generic: true };
      }
      return null;
    }

    function launchApp(q) {
      const res = resolveApp(q);
      if (!res) return false;

      speak(`Launching ${res.n}.`);
      if (res.u) {
        const btn = $('app-btn');
        btn.href = res.u;
        btn.innerText = `🚀 Open ${res.n} Now`;
        btn.classList.remove('hidden');

        // Immediate redirection attempt
        try { window.location.href = res.u; } catch (e) {}

        // If generic app not installed, route to Play Store after timeout
        if (res.generic && isDroid) {
          setTimeout(() => {
            btn.href = `market://search?q=${res.n}`;
            btn.innerText = `🔍 Find ${res.n} in Store`;
          }, 1500);
        }
        setTimeout(() => btn.classList.add('hidden'), 9000);
      }
      return true;
    }

    // --- 3D ORB ---
    let scene, cam, ren, core, pts, base;
    const clock = new THREE.Clock();
    function init3D() {
      scene = new THREE.Scene();
      cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100); cam.position.z = 2.4;
      ren = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      ren.setSize(innerWidth, innerHeight);
      ren.setPixelRatio(Math.min(devicePixelRatio, 2));
      $('c-box').appendChild(ren.domElement);

      const geo = new THREE.IcosahedronGeometry(0.65, 3);
      base = geo.attributes.position.array.slice();
      core = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff1744, wireframe: true, transparent: true, opacity: 0.8 }));
      pts = new THREE.Points(new THREE.SphereGeometry(0.8, 24, 24), new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.025 }));
      scene.add(core, pts);

      (function loop() {
        requestAnimationFrame(loop);
        const t = clock.getElapsedTime(), sp = state === "THINKING" ? 0.04 : (state === "SPEAKING" ? 0.02 : 0.005);
        core.rotation.y += sp; pts.rotation.y -= sp * 0.7;
        const pos = core.geometry.attributes.position, amp = state === "SPEAKING" ? 0.12 : 0.02;
        for (let i = 0; i < pos.count; i++) {
          const w = 1 + Math.sin(t * 8 + base[i * 3] * 4) * amp;
          pos.setXYZ(i, base[i * 3] * w, base[i * 3 + 1] * w, base[i * 3 + 2] * w);
        }
        pos.needsUpdate = true;
        core.material.color.setHex((state === "LISTENING" || state === "THINKING") ? 0x00e5ff : 0xff1744);
        ren.render(scene, cam);
      })();
    }

    // --- VOICE & SPEECH ---
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SR ? new SR() : null;
    if (rec) {
      rec.continuous = true;
      rec.onresult = e => {
        const txt = e.results[e.results.length - 1][0].transcript.trim();
        if (launchApp(txt)) return;
        askEV(txt);
      };
      rec.onend = () => { if (state !== "OFF" && state !== "SPEAKING") try { rec.start(); } catch(e){} };
    }

    function speak(txt) {
      speechSynthesis.cancel(); if (rec) try { rec.stop(); } catch(e){}
      setHud("SPEAKING");
      const clean = txt.replace(/```[\s\S]*?```/g, "Code displayed on screen.").replace(/[#*`_]/g, "");
      $('sub').innerText = `"${clean}"`;
      const u = new SpeechSynthesisUtterance(clean);
      u.onend = u.onerror = () => { setHud("LISTENING"); if (rec) try { rec.start(); } catch(e){} };
      speechSynthesis.speak(u);
    }

    // --- BULLETPROOF AI PIPELINE ---
    async function callAI(sys, q) {
      if (KEY.startsWith("AIza")) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: `${sys}\nUser: ${q}` }] }] })
          });
          const d = await r.json();
          if (d?.candidates?.[0]?.content?.parts?.[0]?.text) return d.candidates[0].content.parts[0].text;
        } catch(e) {}
      }
      if (KEY.startsWith("gsk_")) {
        try {
          const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: sys }, { role: "user", content: q }], max_tokens: 250 })
          });
          const d = await r.json();
          if (d?.choices?.[0]?.message?.content) return d.choices[0].message.content;
        } catch(e) {}
      }
      // Reliable direct text endpoint
      const prompt = encodeURIComponent(`${sys} Question: ${q}`);
      const res = await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
      return await res.text();
    }

    async function askEV(q) {
      if (!q) return;
      if (launchApp(q)) return;
      setHud("THINKING"); $('sub').innerText = `You: "${q}"`;
      const sys = `You are E.V., an AI voice assistant. User: ${NAME || "friend"}. Reply concisely in 1-2 short sentences. Format code in markdown blocks.`;

      try {
        const ans = await callAI(sys, q);
        if (ans.includes("```")) {
          $('workspace').classList.remove('hidden');
          $('workspace').innerText = ans.match(/```(?:\w+)?([\s\S]*?)```/)[1] || ans;
        }
        speak(ans.split("```")[0].trim());
      } catch (e) {
        speak("I am having trouble connecting. Tap setup to verify your key or network.");
      }
    }

    function setHud(s) {
      state = s;
      const c = (s === "LISTENING" || s === "THINKING") ? "#00e5ff" : "#ff1744";
      $('hud').style.borderColor = $('mic').style.borderColor = $('dot').style.backgroundColor = c;
      $('badge').innerText = s; $('badge').style.color = c;
      $('st-txt').innerText = s === "OFF" ? "E.V. CORE OFFLINE" : (s === "SPEAKING" ? "E.V. LIVE" : s);
      $('mic').innerText = s === "OFF" ? "TAP TO LINK" : (s === "SPEAKING" ? "INTERRUPT" : "LISTENING...");
    }

    function toggleMic() {
      if (state === "SPEAKING") { speechSynthesis.cancel(); setHud("LISTENING"); if (rec) try { rec.start(); } catch(e){} }
      else if (state === "OFF") { speak(NAME ? `Online, ${NAME}.` : "E.V. system online."); }
      else { setHud("LISTENING"); if (rec) try { rec.start(); } catch(e){} }
    }

    window.onload = () => { init3D(); setHud("OFF"); };
    window.onresize = () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); };
  </script>
</body>
</html>
