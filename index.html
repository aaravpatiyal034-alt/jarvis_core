<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS Mark X Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #02060f;
      font-family: 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      width: 100vw; height: 100vh;
      position: relative;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1; touch-action: none;
    }
    #status-hud {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      background: rgba(2, 10, 24, 0.92);
      border: 1px solid #00d9ff;
      padding: 8px 18px; border-radius: 20px;
      backdrop-filter: blur(12px); color: #00d9ff;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; box-shadow: 0 0 18px rgba(0, 217, 255, 0.25);
      display: flex; align-items: center; gap: 10px;
      transition: all 0.3s ease;
    }
    #status-indicator {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: #00d9ff; box-shadow: 0 0 8px #00d9ff;
    }
    #control-bar {
      position: absolute; top: 58px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; gap: 6px; width: 92%; max-width: 440px;
    }
    #api-input {
      flex: 1; background: rgba(2, 10, 24, 0.9); border: 1px solid rgba(0, 217, 255, 0.35);
      border-radius: 10px; color: #fff; padding: 7px 10px; font-size: 11px;
      outline: none;
    }
    .hud-btn {
      background: rgba(0, 217, 255, 0.2); border: 1px solid #00d9ff;
      color: #00d9ff; border-radius: 10px; padding: 7px 12px; font-size: 10px;
      cursor: pointer; font-weight: bold; text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
    #workspace-panel {
      position: absolute; top: 100px; left: 50%;
      transform: translateX(-50%); width: 94%; max-width: 600px;
      max-height: 55vh; z-index: 9998;
      background: rgba(2, 14, 28, 0.96); border: 1px solid #00d9ff;
      border-radius: 14px; padding: 14px; color: #e2e8f0;
      backdrop-filter: blur(18px); box-shadow: 0 0 35px rgba(0, 217, 255, 0.2);
      overflow-y: auto; display: none; font-size: 12px; line-height: 1.5;
    }
    #workspace-panel pre {
      background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 8px; padding: 10px; overflow-x: auto;
      color: #00ffcc; font-family: monospace; font-size: 11px;
      margin-top: 8px; white-space: pre-wrap; word-break: break-all;
    }
    #hud {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%); z-index: 9999; text-align: center;
      width: 90%;
    }
    #micBtn {
      background: rgba(0, 217, 255, 0.15); border: 2px solid #00d9ff;
      color: #00d9ff; padding: 14px 20px; font-size: 12px;
      font-weight: bold; letter-spacing: 1.2px; border-radius: 30px;
      box-shadow: 0 0 22px rgba(0, 217, 255, 0.28); backdrop-filter: blur(10px);
      outline: none; cursor: pointer; width: 100%; max-width: 350px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="status-hud">
    <div id="status-indicator"></div>
    <span id="status-text">INITIALIZING CORE...</span>
  </div>

  <div id="control-bar">
    <input type="password" id="api-input" placeholder="Paste Groq Key (gsk_...)" />
    <button class="hud-btn" id="save-key-btn">SAVE</button>
    <button class="hud-btn" id="download-btn" style="display:none;">SAVE CODE</button>
  </div>

  <div id="workspace-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 id="panel-title" style="color:#00d9ff; font-size:13px;">🛡️ SERIOUS MODE WORKSPACE</h3>
      <button class="hud-btn" onclick="document.getElementById('workspace-panel').style.display='none'">CLOSE</button>
    </div>
    <div id="workspace-content" style="margin-top:8px;"></div>
  </div>

  <div id="hud">
    <button id="micBtn">TAP TO INITIALIZE JARVIS</button>
  </div>

  <script>
    let GROQ_API_KEY = (localStorage.getItem('jarvis_groq_key') || "").trim();
    let currentResearchData = "";

    const STATE = { OFF: "OFF", STANDBY: "STANDBY", LISTENING: "LISTENING", THINKING: "THINKING", SPEAKING: "SPEAKING" };
    const MODE = { STANDARD: "STANDARD", SERIOUS: "SERIOUS" };
    
    let currentState = STATE.OFF;
    let currentMode = MODE.STANDARD;
    let chatMemory = [];

    const apiInput = document.getElementById('api-input');
    const downloadBtn = document.getElementById('download-btn');
    apiInput.value = GROQ_API_KEY;

    document.getElementById('save-key-btn').addEventListener('click', () => {
      GROQ_API_KEY = apiInput.value.replace(/[^a-zA-Z0-9_-]/g, "");
      localStorage.setItem('jarvis_groq_key', GROQ_API_KEY);
      playAudioFx('wake');
      document.getElementById('status-text').innerText = "API KEY SAVED";
      alert("Key saved successfully.");
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentResearchData) return;
      const blob = new Blob([currentResearchData], { type: 'text/markdown' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `jarvis_output_${Date.now()}.md`;
      link.click();
    });

    let scene, camera, renderer, globe, basePositions;
    const clock = new THREE.Clock();

    function init3D() {
      try {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 2.5);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const gridFloor = new THREE.GridHelper(6, 20, 0x00d9ff, 0x002244);
        gridFloor.position.y = -1.2;
        scene.add(gridFloor);

        const globeGeo = new THREE.SphereGeometry(0.8, 28, 28);
        basePositions = globeGeo.attributes.position.array.slice();
        const globeMat = new THREE.MeshBasicMaterial({ color: 0x00d9ff, wireframe: true, transparent: true, opacity: 0.85 });
        globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        let isDragging = false, lastTouchX = 0, lastTouchY = 0, velX = 0, velY = 0;
        container.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) { isDragging = true; lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; }
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
          if (!isDragging || e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - lastTouchX;
          const dy = e.touches[0].clientY - lastTouchY;
          velY = dx * 0.005; velX = dy * 0.005;
          lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
        }, { passive: true });
        container.addEventListener('touchend', () => isDragging = false);

        function animate() {
          requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();
          let themeColor = currentMode === MODE.SERIOUS ? 0xff0033 : 0x00d9ff;

          globe.rotation.y += velY + (currentState === STATE.THINKING ? 0.025 : 0.003);
          globe.rotation.x += velX;
          velX *= 0.92; velY *= 0.92;

          if (currentState === STATE.SPEAKING) {
            const pos = globe.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
              const wave = Math.sin(elapsedTime * 9 + basePositions[i*3]*6 + basePositions[i*3+1]*6) * 0.07;
              pos.setXYZ(i, basePositions[i*3]*(1+wave), basePositions[i*3+1]*(1+wave), basePositions[i*3+2]*(1+wave));
            }
            pos.needsUpdate = true;
          } else {
            const pos = globe.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) pos.setXYZ(i, basePositions[i*3], basePositions[i*3+1], basePositions[i*3+2]);
            pos.needsUpdate = true;
          }

          globe.material.color.setHex(themeColor);
          renderer.render(scene, camera);
        }
        animate();
      } catch (e) {
        console.error("Three.js setup error:", e);
      }
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudioFx(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'wake') {
          osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch(e) {}
    }

    function speakJarvis(text, targetNextState = STATE.STANDBY) {
      window.speechSynthesis.cancel();
      if (recognition) try { recognition.stop(); } catch(e){}
      setSystemState(STATE.SPEAKING);

      let cleanSpeech = text.replace(/```[\s\S]*?```/g, "Code output rendered on your interface, sir.").replace(/[#*`_]/g, "");
      const utterance = new SpeechSynthesisUtterance(cleanSpeech);
      
      const voices = window.speechSynthesis.getVoices();
      const britishVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('English (United Kingdom)'));
      if (britishVoice) utterance.voice = britishVoice;

      utterance.pitch = currentMode === MODE.SERIOUS ? 0.6 : 0.65;
      utterance.rate = 1.05;

      utterance.onend = () => { setSystemState(targetNextState); restartRecognition(); };
      utterance.onerror = () => { setSystemState(targetNextState); restartRecognition(); };

      try { window.speechSynthesis.speak(utterance); } catch (e) {}
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = async (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        
        if (transcript.includes("open whatsapp")) {
          window.location.href = "whatsapp://";
          speakJarvis("Opening WhatsApp, sir.", STATE.LISTENING); return;
        }
        if (transcript.includes("open youtube")) {
          window.location.href = "vnd.youtube://";
          speakJarvis("Opening YouTube, sir.", STATE.LISTENING); return;
        }

        if (transcript.includes("serious mode") || transcript.includes("code mode")) {
          currentMode = MODE.SERIOUS;
          setSystemState(currentState);
          document.getElementById('workspace-panel').style.display = "block";
          speakJarvis("Serious mode activated. Ready for specifications.", STATE.LISTENING); return;
        }
        if (transcript.includes("standard mode")) {
          currentMode = MODE.STANDARD;
          setSystemState(currentState);
          document.getElementById('workspace-panel').style.display = "none";
          speakJarvis("Standard operations active.", STATE.LISTENING); return;
        }

        if (currentState === STATE.STANDBY && (transcript.includes("jarvis") || transcript.includes("hey jarvis"))) {
          let clean = transcript.replace(/hey jarvis|jarvis/gi, "").trim();
          setSystemState(STATE.LISTENING);
          if (clean.length > 2) handleUserQuery(clean);
          else speakJarvis("Yes, sir?", STATE.LISTENING);
        } else if (currentState === STATE.LISTENING && transcript.length > 1) {
          handleUserQuery(transcript);
        }
      };

      recognition.onend = () => { if (currentState !== STATE.OFF && currentState !== STATE.SPEAKING) restartRecognition(); };
    }

    function restartRecognition() {
      if (!recognition) return;
      try { recognition.stop(); } catch(e) {}
      setTimeout(() => { try { if (currentState !== STATE.OFF && currentState !== STATE.SPEAKING) recognition.start(); } catch(e) {} }, 250);
    }

    async function handleUserQuery(query) {
      setSystemState(STATE.THINKING);
      
      const key = (GROQ_API_KEY || localStorage.getItem('jarvis_groq_key') || "").trim();
      if (!key) {
        document.getElementById('status-text').innerText = "ERROR: NO API KEY";
        alert("Please paste your Groq API key (gsk_...) in the top bar and tap SAVE.");
        speakJarvis("Sir, please save your Groq API key in the top bar.", STATE.STANDBY);
        return;
      }

      let sysPrompt = "You are J.A.R.V.I.S. from Iron Man. Be witty, British, highly intelligent, and speak in 1-2 concise sentences.";
      if (currentMode === MODE.SERIOUS) {
        sysPrompt = "You are JARVIS in Serious Mode. Provide a brief 1-sentence intro followed by complete production code enclosed inside ``` codeblocks.";
      }

      chatMemory.push({ role: "user", content: query });
      if (chatMemory.length > 6) chatMemory = chatMemory.slice(-6);

      try {
        const response = await fetch("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + key
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [{ role: "system", content: sysPrompt }, ...chatMemory],
            max_tokens: 600,
            temperature: 0.5
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData?.error?.message || ("HTTP " + response.status);
          throw new Error(errMsg);
        }

        const data = await response.json();
        const aiResponse = data.choices[0].message.content;

        chatMemory.push({ role: "assistant", content: aiResponse });
        currentResearchData = aiResponse;

        let voiceText = aiResponse;
        if (aiResponse.includes("```")) {
          voiceText = aiResponse.split("```")[0].trim() || "Code compiled to your workspace, sir.";
        }

        if (currentMode === MODE.SERIOUS || aiResponse.includes("```")) {
          downloadBtn.style.display = "block";
          document.getElementById('workspace-panel').style.display = "block";
          document.getElementById('workspace-content').innerHTML = aiResponse
            .replace(/```(\w+)?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/\n/g, "<br>");
        }

        speakJarvis(voiceText, STATE.LISTENING);
      } catch (err) {
        document.getElementById('status-text').innerText = "ERR: " + err.message.slice(0, 22);
        alert("GROQ DIAGNOSTIC ERROR:\n" + err.message);
        speakJarvis("Diagnostic anomaly encountered, sir.", STATE.STANDBY);
      }
    }

    function setSystemState(newState) {
      currentState = newState;
      let pColor = currentMode === MODE.SERIOUS ? "#ff0033" : "#00d9ff";
      
      const hud = document.getElementById('status-hud');
      const ind = document.getElementById('status-indicator');
      const btn = document.getElementById('micBtn');

      hud.style.borderColor = pColor; hud.style.color = pColor;
      ind.style.backgroundColor = pColor; ind.style.boxShadow = `0 0 8px ${pColor}`;
      btn.style.borderColor = pColor; btn.style.color = pColor;

      const st = document.getElementById('status-text');
      if (newState === STATE.OFF) { st.innerText = "SYSTEM OFF"; btn.innerText = "TAP TO INITIALIZE JARVIS"; }
      if (newState === STATE.STANDBY) { st.innerText = "STANDBY (SAY 'HEY JARVIS')"; btn.innerText = "STANDBY • TAP TO WAKE"; }
      if (newState === STATE.LISTENING) { st.innerText = "LISTENING..."; btn.innerText = "LISTENING..."; }
      if (newState === STATE.THINKING) { st.innerText = "COMPUTING..."; btn.innerText = "THINKING..."; }
      if (newState === STATE.SPEAKING) { st.innerText = "SPEAKING"; btn.innerText = "TAP TO INTERRUPT"; }
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      audioCtx.resume();
      window.speechSynthesis.getVoices();
      window.speechSynthesis.cancel();
      
      if (currentState === STATE.OFF) {
        setSystemState(STATE.STANDBY);
        playAudioFx('wake');
        speakJarvis("Jarvis Mark X core initialized and ready, sir.", STATE.STANDBY);
        if (recognition) try { recognition.start(); } catch(e){}
      } else if (currentState === STATE.SPEAKING) {
        window.speechSynthesis.cancel();
        setSystemState(STATE.LISTENING);
        restartRecognition();
      } else {
        playAudioFx('wake');
        setSystemState(STATE.LISTENING);
        speakJarvis("At your service, sir.", STATE.LISTENING);
      }
    });

    window.onload = () => {
      init3D();
      setSystemState(STATE.OFF);
    };
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
