<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>E.V. Suit OS | Spider-Man: Brand New Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #060913;
      font-family: 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      width: 100vw; height: 100vh;
      position: relative;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1; touch-action: none;
    }
    #status-hud {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      background: rgba(6, 12, 26, 0.92);
      border: 1px solid #ff3344;
      padding: 8px 18px; border-radius: 20px;
      backdrop-filter: blur(12px); color: #ff3344;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; box-shadow: 0 0 18px rgba(255, 51, 68, 0.35);
      display: flex; align-items: center; gap: 10px;
      transition: all 0.3s ease;
    }
    #status-indicator {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: #ff3344; box-shadow: 0 0 8px #ff3344;
    }
    #control-bar {
      position: absolute; top: 58px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; gap: 6px; width: 92%; max-width: 440px;
    }
    #api-input {
      flex: 1; background: rgba(6, 12, 26, 0.92); border: 1px solid rgba(255, 51, 68, 0.4);
      border-radius: 10px; color: #fff; padding: 7px 10px; font-size: 11px;
      outline: none;
    }
    .hud-btn {
      background: rgba(255, 51, 68, 0.2); border: 1px solid #ff3344;
      color: #ff3344; border-radius: 10px; padding: 7px 12px; font-size: 10px;
      cursor: pointer; font-weight: bold; text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
    #workspace-panel {
      position: absolute; top: 100px; left: 50%;
      transform: translateX(-50%); width: 94%; max-width: 600px;
      max-height: 55vh; z-index: 9998;
      background: rgba(8, 14, 28, 0.96); border: 1px solid #ff3344;
      border-radius: 14px; padding: 14px; color: #e2e8f0;
      backdrop-filter: blur(18px); box-shadow: 0 0 35px rgba(255, 51, 68, 0.25);
      overflow-y: auto; display: none; font-size: 12px; line-height: 1.5;
    }
    #workspace-panel pre {
      background: rgba(2, 6, 14, 0.85); border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 8px; padding: 10px; overflow-x: auto;
      color: #00e5ff; font-family: monospace; font-size: 11px;
      margin-top: 8px; white-space: pre-wrap; word-break: break-all;
    }
    #hud {
      position: absolute; bottom: 25px; left: 50%;
      transform: translateX(-50%); z-index: 9999; text-align: center;
      width: 90%;
    }
    #micBtn {
      background: rgba(255, 51, 68, 0.15); border: 2px solid #ff3344;
      color: #ff3344; padding: 14px 20px; font-size: 12px;
      font-weight: bold; letter-spacing: 1.2px; border-radius: 30px;
      box-shadow: 0 0 22px rgba(255, 51, 68, 0.35); backdrop-filter: blur(10px);
      outline: none; cursor: pointer; width: 100%; max-width: 350px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="status-hud">
    <div id="status-indicator"></div>
    <span id="status-text">E.V. ONLINE • STANDBY</span>
  </div>

  <div id="control-bar">
    <input type="password" id="api-input" placeholder="Paste Groq Key (gsk_...)" />
    <button class="hud-btn" id="save-key-btn">SAVE</button>
    <button class="hud-btn" id="download-btn" style="display:none;">SAVE CODE</button>
  </div>

  <div id="workspace-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 id="panel-title" style="color:#00e5ff; font-size:13px;">🕸️ TACTICAL HUD WORKSPACE</h3>
      <button class="hud-btn" onclick="document.getElementById('workspace-panel').style.display='none'">CLOSE</button>
    </div>
    <div id="workspace-content" style="margin-top:8px;"></div>
  </div>

  <div id="hud">
    <button id="micBtn">TAP TO CONNECT WITH E.V.</button>
  </div>

  <script>
    let GROQ_API_KEY = (localStorage.getItem('jarvis_groq_key') || "").trim();
    let currentResearchData = "";

    const STATE = { OFF: "OFF", STANDBY: "STANDBY", LISTENING: "LISTENING", THINKING: "THINKING", SPEAKING: "SPEAKING" };
    const MODE = { STANDARD: "STANDARD", SERIOUS: "SERIOUS" };
    
    let currentState = STATE.OFF;
    let currentMode = MODE.STANDARD;
    let chatMemory = [];

    const apiInput = document.getElementById('api-input');
    const downloadBtn = document.getElementById('download-btn');
    apiInput.value = GROQ_API_KEY;

    document.getElementById('save-key-btn').addEventListener('click', () => {
      GROQ_API_KEY = apiInput.value.replace(/[^a-zA-Z0-9_-]/g, "");
      localStorage.setItem('jarvis_groq_key', GROQ_API_KEY);
      playAudioFx('wake');
      document.getElementById('status-text').innerText = "LINK ESTABLISHED";
      alert("Key saved successfully.");
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentResearchData) return;
      const blob = new Blob([currentResearchData], { type: 'text/markdown' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `ev_tactical_data_${Date.now()}.md`;
      link.click();
    });

    let scene, camera, renderer, globe, basePositions;
    const clock = new THREE.Clock();

    function init3D() {
      try {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 2.5);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Web-like grid ground
        const gridFloor = new THREE.GridHelper(6, 24, 0xff3344, 0x003366);
        gridFloor.position.y = -1.2;
        scene.add(gridFloor);

        // Core holographic sphere
        const globeGeo = new THREE.SphereGeometry(0.8, 28, 28);
        basePositions = globeGeo.attributes.position.array.slice();
        const globeMat = new THREE.MeshBasicMaterial({ color: 0xff3344, wireframe: true, transparent: true, opacity: 0.85 });
        globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        let isDragging = false, lastTouchX = 0, lastTouchY = 0, velX = 0, velY = 0;
        container.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) { isDragging = true; lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; }
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
          if (!isDragging || e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - lastTouchX;
          const dy = e.touches[0].clientY - lastTouchY;
          velY = dx * 0.005; velX = dy * 0.005;
          lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
        }, { passive: true });
        container.addEventListener('touchend', () => isDragging = false);

        function animate() {
          requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();
          let themeColor = currentMode === MODE.SERIOUS ? 0x00e5ff : 0xff3344;

          globe.rotation.y += velY + (currentState === STATE.THINKING ? 0.025 : 0.003);
          globe.rotation.x += velX;
          velX *= 0.92; velY *= 0.92;

          if (currentState === STATE.SPEAKING) {
            const pos = globe.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
              const wave = Math.sin(elapsedTime * 9 + basePositions[i*3]*6 + basePositions[i*3+1]*6) * 0.07;
              pos.setXYZ(i, basePositions[i*3]*(1+wave), basePositions[i*3+1]*(1+wave), basePositions[i*3+2]*(1+wave));
            }
            pos.needsUpdate = true;
          } else {
            const pos = globe.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) pos.setXYZ(i, basePositions[i*3], basePositions[i*3+1], basePositions[i*3+2]);
            pos.needsUpdate = true;
          }

          globe.material.color.setHex(themeColor);
          renderer.render(scene, camera);
        }
        animate();
      } catch (e) {
        console.error("Three.js setup error:", e);
      }
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudioFx(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'wake') {
          osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(1040, now + 0.15);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'standby') {
          osc.frequency.setValueAtTime(700, now); osc.frequency.exponentialRampToValueAtTime(380, now + 0.2);
          gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch(e) {}
    }

    function speakEV(text, targetNextState = STATE.STANDBY) {
      window.speechSynthesis.cancel();
      if (recognition) try { recognition.stop(); } catch(e){}
      setSystemState(STATE.SPEAKING);

      let cleanSpeech = text.replace(/```[\s\S]*?```/g, "Code telemetry uploaded to HUD.").replace(/[#*`_]/g, "");
      const utterance = new SpeechSynthesisUtterance(cleanSpeech);
      
      const voices = window.speechSynthesis.getVoices();
      // Match a calm, supportive female voice like E.V.
      const evVoice = voices.find(v => (v.name.includes('Female') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Zira') || v.lang.includes('en-US')) && !v.name.includes('Male'));
      if (evVoice) utterance.voice = evVoice;

      utterance.pitch = 1.05;
      utterance.rate = 1.02;

      utterance.onend = () => { setSystemState(targetNextState); restartRecognition(); };
      utterance.onerror = () => { setSystemState(targetNextState); restartRecognition(); };

      try { window.speechSynthesis.speak(utterance); } catch (e) {}
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = async (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        
        if (transcript.includes("open whatsapp")) {
          window.location.href = "whatsapp://";
          speakEV("Routing coms to WhatsApp, Peter.", STATE.LISTENING); return;
        }
        if (transcript.includes("open youtube")) {
          window.location.href = "vnd.youtube://";
          speakEV("Opening YouTube feed.", STATE.LISTENING); return;
        }

        if (transcript.includes("serious mode") || transcript.includes("combat mode") || transcript.includes("code mode")) {
          currentMode = MODE.SERIOUS;
          setSystemState(currentState);
          document.getElementById('workspace-panel').style.display = "block";
          speakEV("Tactical mode online. Ready for telemetry.", STATE.LISTENING); return;
        }
        if (transcript.includes("standard mode") || transcript.includes("normal mode")) {
          currentMode = MODE.STANDARD;
          setSystemState(currentState);
          document.getElementById('workspace-panel').style.display = "none";
          speakEV("Standard suit monitoring active.", STATE.LISTENING); return;
        }

        if (currentState === STATE.STANDBY && (transcript.includes("ev") || transcript.includes("hey ev") || transcript.includes("e.v.") || transcript.includes("jarvis"))) {
          let clean = transcript.replace(/hey ev|e\.v\.|ev|jarvis/gi, "").trim();
          setSystemState(STATE.LISTENING);
          if (clean.length > 2) handleUserQuery(clean);
          else speakEV("I'm right here, Peter. What's on your mind?", STATE.LISTENING);
        } else if (currentState === STATE.LISTENING && transcript.length > 1) {
          handleUserQuery(transcript);
        }
      };

      recognition.onend = () => { if (currentState !== STATE.OFF && currentState !== STATE.SPEAKING) restartRecognition(); };
    }

    function restartRecognition() {
      if (!recognition) return;
      try { recognition.stop(); } catch(e) {}
      setTimeout(() => { try { if (currentState !== STATE.OFF && currentState !== STATE.SPEAKING) recognition.start(); } catch(e) {} }, 250);
    }

    async function handleUserQuery(query) {
      setSystemState(STATE.THINKING);
      
      const key = (GROQ_API_KEY || localStorage.getItem('jarvis_groq_key') || "").trim();
      if (!key) {
        document.getElementById('status-text').innerText = "ERROR: NO API KEY";
        alert("Please paste your Groq API key (gsk_...) in the top bar and tap SAVE.");
        speakEV("Peter, I need your Groq API key in the top bar to initialize.", STATE.STANDBY);
        return;
      }

      // Persona prompt matching E.V. from Spider-Man: Brand New Day
      let sysPrompt = "You are E.V., Peter Parker's homemade, loyal suit AI and closest companion from Spider-Man: Brand New Day. You are intelligent, warm, attentive, slightly witty, and speak naturally like a supportive close friend and tactical suit assistant. Address him naturally (often as Peter). Keep verbal responses concise in 1-2 natural sentences.";
      if (currentMode === MODE.SERIOUS) {
        sysPrompt = "You are E.V. in Tactical/Serious Mode. Provide 1 crisp, focused sentence followed by complete, production-ready code inside ``` codeblocks.";
      }

      chatMemory.push({ role: "user", content: query });
      if (chatMemory.length > 6) chatMemory = chatMemory.slice(-6);

      try {
        // FIXED: Clean endpoint string without Markdown link syntax
        const response = await fetch("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + key
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [{ role: "system", content: sysPrompt }, ...chatMemory],
            max_tokens: 600,
            temperature: 0.6
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData?.error?.message || ("HTTP " + response.status);
          throw new Error(errMsg);
        }

        const data = await response.json();
        const aiResponse = data.choices[0].message.content;

        chatMemory.push({ role: "assistant", content: aiResponse });
        currentResearchData = aiResponse;

        let voiceText = aiResponse;
        if (aiResponse.includes("```")) {
          voiceText = aiResponse.split("```")[0].trim() || "Uploaded your code to the suit HUD, Peter.";
        }

        if (currentMode === MODE.SERIOUS || aiResponse.includes("```")) {
          downloadBtn.style.display = "block";
          document.getElementById('workspace-panel').style.display = "block";
          document.getElementById('workspace-content').innerHTML = aiResponse
            .replace(/```(\w+)?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/\n/g, "<br>");
        }

        speakEV(voiceText, STATE.LISTENING);
      } catch (err) {
        document.getElementById('status-text').innerText = "ERR: " + err.message.slice(0, 22);
        alert("E.V. DIAGNOSTIC ERROR:\n" + err.message);
        speakEV("Telemetry anomaly encountered. Check your connection or API key.", STATE.STANDBY);
      }
    }

    function setSystemState(newState) {
      currentState = newState;
      let pColor = currentMode === MODE.SERIOUS ? "#00e5ff" : "#ff3344";
      
      const hud = document.getElementById('status-hud');
      const ind = document.getElementById('status-indicator');
      const btn = document.getElementById('micBtn');

      hud.style.borderColor = pColor; hud.style.color = pColor;
      ind.style.backgroundColor = pColor; ind.style.boxShadow = `0 0 8px ${pColor}`;
      btn.style.borderColor = pColor; btn.style.color = pColor;

      const st = document.getElementById('status-text');
      if (newState === STATE.OFF) { st.innerText = "E.V. SUIT OFFLINE"; btn.innerText = "TAP TO CONNECT WITH E.V."; }
      if (newState === STATE.STANDBY) { st.innerText = "E.V. ONLINE (SAY 'HEY E.V.')"; btn.innerText = "STANDBY • TAP TO WAKE"; }
      if (newState === STATE.LISTENING) { st.innerText = "E.V. LISTENING..."; btn.innerText = "LISTENING..."; }
      if (newState === STATE.THINKING) { st.innerText = "ANALYZING..."; btn.innerText = "THINKING..."; }
      if (newState === STATE.SPEAKING) { st.innerText = "E.V. SPEAKING"; btn.innerText = "TAP TO INTERRUPT"; }
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      audioCtx.resume();
      window.speechSynthesis.getVoices();
      window.speechSynthesis.cancel();
      
      if (currentState === STATE.OFF) {
        setSystemState(STATE.STANDBY);
        playAudioFx('wake');
        speakEV("E.V. systems online. Ready when you are, Peter.", STATE.STANDBY);
        if (recognition) try { recognition.start(); } catch(e){}
      } else if (currentState === STATE.SPEAKING) {
        window.speechSynthesis.cancel();
        setSystemState(STATE.LISTENING);
        restartRecognition();
      } else {
        playAudioFx('wake');
        setSystemState(STATE.LISTENING);
        speakEV("I'm listening, Peter.", STATE.LISTENING);
      }
    });

    window.onload = () => {
      init3D();
      setSystemState(STATE.OFF);
    };
    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
