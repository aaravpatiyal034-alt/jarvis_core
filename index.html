<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.V. Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    header { display: flex; flex-direction: column; gap: 10px; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
      margin-right: 8px;
    }
    .key-bar { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    button {
      background: #2563eb;
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #output-box {
      flex: 1;
      background: #1e293b;
      border-radius: 8px;
      margin: 16px 0;
      padding: 14px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      border: 1px solid #334155;
      white-space: pre-wrap;
    }
    #micBtn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      background: #0284c7;
    }
    #micBtn.listening { background: #ef4444; }
  </style>
</head>
<body>

  <header>
    <div class="status-row">
      <div>
        <span class="indicator" id="ind"></span>
        <span id="status-text">Ready</span>
      </div>
      <span style="color: #94a3b8; font-size: 11px;">Groq LLM</span>
    </div>
    <div class="key-bar">
      <input type="password" id="key-input" placeholder="Enter Groq API Key (gsk_...)" />
      <button onclick="saveKey()">Save</button>
    </div>
  </header>

  <div id="output-box">Responses and transcriptions will appear here.</div>

  <footer>
    <button id="micBtn" onclick="toggleVoice()">Start Listening</button>
  </footer>

  <script>
    let apiKey = (localStorage.getItem('assistant_api_key') || "").trim();
    let isListening = false;
    let chatMemory = [];
    
    const keyInput = document.getElementById('key-input');
    const statusText = document.getElementById('status-text');
    const indicator = document.getElementById('ind');
    const outputBox = document.getElementById('output-box');
    const micBtn = document.getElementById('micBtn');

    if (apiKey) keyInput.value = apiKey;

    function saveKey() {
      apiKey = keyInput.value.trim();
      localStorage.setItem('assistant_api_key', apiKey);
      setStatus("Key Saved", "#22c55e");
      outputBox.innerText = "API key saved. You can now start using voice.";
    }

    function setStatus(text, color = "#94a3b8") {
      statusText.innerText = text;
      indicator.style.background = color;
    }

    // Text to Speech
    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.onend = () => setStatus("Ready", "#22c55e");
      window.speechSynthesis.speak(utterance);
    }

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.innerText = "Listening...";
        micBtn.classList.add("listening");
        setStatus("Listening", "#ef4444");
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        outputBox.innerText = `You: ${text}\n\nThinking...`;
        sendToGroq(text);
      };

      recognition.onerror = (event) => {
        setStatus("Mic Error", "#f59e0b");
        outputBox.innerText = `Microphone error: ${event.error}`;
        resetMicButton();
      };

      recognition.onend = () => resetMicButton();
    } else {
      outputBox.innerText = "Speech Recognition is not supported in this browser. Please use Chrome or Edge.";
    }

    function resetMicButton() {
      isListening = false;
      micBtn.innerText = "Start Listening";
      micBtn.classList.remove("listening");
    }

    function toggleVoice() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // Send query to Groq
    async function sendToGroq(prompt) {
      if (!apiKey) {
        setStatus("Missing Key", "#f59e0b");
        outputBox.innerText = "Error: Please paste your Groq API key above and click Save.";
        speak("Please enter your API key first.");
        return;
      }

      setStatus("Processing", "#3b82f6");

      chatMemory.push({ role: "user", content: prompt });
      if (chatMemory.length > 6) chatMemory = chatMemory.slice(-6);

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "You are a helpful, direct, and concise AI assistant. Do not roleplay or assume any fictional character identity." },
              ...chatMemory
            ],
            max_tokens: 300,
            temperature: 0.5
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const reply = data.choices[0].message.content.trim();

        chatMemory.push({ role: "assistant", content: reply });
        outputBox.innerText = `You: ${prompt}\n\nAI: ${reply}`;
        setStatus("Speaking", "#22c55e");
        speak(reply);

      } catch (err) {
        setStatus("Error", "#ef4444");
        outputBox.innerText = `API Error: ${err.message}`;
        speak("There was an error communicating with the service.");
      }
    }
  </script>
</body>
</html>
