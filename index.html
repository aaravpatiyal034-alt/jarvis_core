<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E.V. • Live Mobile AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { width: 100vw; height: 100dvh; overflow: hidden; background: #030611; color: #e2e8f0; font-family: system-ui, sans-serif; position: fixed; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; touch-action: none; }
    .hud-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at 50% 45%, transparent 30%, #030611 92%); }
  </style>
</head>
<body class="flex flex-col justify-between p-3 max-w-md mx-auto">

  <div id="canvas-container"></div>
  <div class="hud-overlay"></div>
  <div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition bg-[#050b1a] border border-[#ff1744] text-cyan-200 text-[11px] font-bold px-4 py-1 rounded-full shadow-[0_0_10px_rgba(255,23,68,0.3)]"></div>

  <!-- TOP BAR -->
  <header class="relative z-10 flex flex-col gap-1.5">
    <div class="flex items-center gap-1.5">
      <div id="status-hud" class="flex-1 bg-[#040b18]/90 border border-[#ff1744] px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-md">
        <span id="dot" class="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_8px_#ff1744]"></span>
        <span id="status-text" class="text-[11px] font-bold tracking-wider uppercase truncate">E.V. CORE OFFLINE</span>
      </div>
      <button id="mode-btn" class="bg-[#040b18]/90 border border-cyan-400/60 text-cyan-300 px-3 py-1.5 rounded-full text-[10px] font-bold">LIVE</button>
      <button id="key-toggle" class="bg-[#040b18]/90 border border-[#ff1744]/70 text-[#ff1744] px-3 py-1.5 rounded-full text-[10px] font-bold">SETUP</button>
    </div>

    <div id="key-bar" class="hidden flex flex-col gap-1.5 bg-[#040b18]/95 border border-cyan-500/40 p-2 rounded-xl backdrop-blur-md">
      <div class="flex gap-1.5">
        <input id="name-input" placeholder="Your Name" class="w-1/3 bg-black/60 border border-[#ff1744]/50 rounded-lg px-2 py-1 text-xs text-white outline-none">
        <input id="api-input" type="password" placeholder="Optional: Groq / Gemini Key" class="flex-1 bg-black/60 border border-cyan-500/30 rounded-lg px-2 py-1 text-xs text-white outline-none">
      </div>
      <div class="flex gap-1.5">
        <button id="save-btn" class="flex-1 bg-[#ff1744] text-white text-[10px] font-bold py-1 rounded-lg">SAVE</button>
        <button id="clear-btn" class="bg-slate-700 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">FREE AI</button>
      </div>
    </div>
  </header>

  <!-- WORKSPACE & SUBTITLES -->
  <main class="relative z-10 flex flex-col justify-end gap-2 pointer-events-none my-auto w-full">
    <div id="workspace" class="hidden pointer-events-auto max-h-[34dvh] bg-[#030916]/95 border border-[#ff1744] rounded-xl p-2.5 overflow-y-auto text-[11px] backdrop-blur-md shadow-[0_0_15px_rgba(255,23,68,0.15)]"></div>
    <div class="pointer-events-auto bg-[#040b18]/85 border border-cyan-500/30 rounded-xl p-2.5 backdrop-blur-md">
      <div class="flex justify-between text-[9px] font-bold tracking-widest text-[#ff1744] uppercase mb-0.5">
        <span id="user-tag">E.V. LIVE NEURAL AI</span>
        <span id="sub-badge" class="text-cyan-400">OFF</span>
      </div>
      <p id="subtitle" class="text-xs text-slate-100 line-clamp-2">"Tap below to initialize live voice link."</p>
    </div>
  </main>

  <!-- BOTTOM CONTROLS -->
  <footer class="relative z-10 flex flex-col gap-1.5">
    <div class="flex gap-1.5">
      <button id="micBtn" class="flex-1 bg-gradient-to-r from-[#ff1744]/30 to-cyan-500/30 border-2 border-[#ff1744] text-white py-3 rounded-full text-xs font-bold tracking-widest uppercase active:scale-95 transition shadow-[0_0_15px_rgba(255,23,68,0.2)]">TAP TO LINK E.V.</button>
      <button id="chat-toggle" class="bg-[#050d1f] border border-cyan-400/60 text-cyan-300 px-3.5 rounded-full text-xs active:scale-95 transition">⌨️</button>
    </div>
    <form id="chat-form" class="hidden flex gap-1.5">
      <input id="chat-input" placeholder="Ask E.V. anything or type 'Open YouTube'..." class="flex-1 bg-[#040b18] border border-cyan-400/50 rounded-full px-3 py-1.5 text-xs text-white outline-none">
      <button class="bg-[#ff1744] text-white text-[10px] font-bold px-3 rounded-full active:scale-95 transition">SEND</button>
    </form>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    let KEY = (localStorage.getItem('ev_groq_key') || "").trim();
    let NAME = (localStorage.getItem('ev_user_name') || "").trim();
    let state = "OFF", mode = "LIVE", memory = [];

    $('api-input').value = KEY; $('name-input').value = NAME;
    const syncTag = () => $('user-tag').innerText = NAME ? `E.V. AI // ${NAME.toUpperCase()}` : "E.V. LIVE NEURAL AI";
    syncTag();

    const toast = m => { const t = $('toast'); t.innerText = m; t.classList.remove('opacity-0'); setTimeout(() => t.classList.add('opacity-0'), 2500); };
    $('key-toggle').onclick = () => $('key-bar').classList.toggle('hidden');
    $('chat-toggle').onclick = () => $('chat-form').classList.toggle('hidden');

    $('save-btn').onclick = () => {
      KEY = $('api-input').value.trim(); NAME = $('name-input').value.trim();
      localStorage.setItem('ev_groq_key', KEY); localStorage.setItem('ev_user_name', NAME);
      syncTag(); $('key-bar').classList.add('hidden'); toast("Saved Profile");
    };
    $('clear-btn').onclick = () => {
      KEY = $('api-input').value = ""; localStorage.removeItem('ev_groq_key');
      $('key-bar').classList.add('hidden'); toast("Using Free Built-in AI");
    };
    $('mode-btn').onclick = () => {
      mode = mode === "LIVE" ? "CODE" : "LIVE";
      $('mode-btn').innerText = mode;
      $('workspace').classList.toggle('hidden', mode === "LIVE");
    };

    // --- APP DEEP LINKS DIRECTORY ---
    const APP_SCHEMES = {
      'whatsapp': 'whatsapp://',
      'youtube': 'vnd.youtube://',
      'instagram': 'instagram://',
      'twitter': 'twitter://',
      'x': 'twitter://',
      'facebook': 'fb://',
      'spotify': 'spotify://',
      'tiktok': 'snssdk1233://',
      'snapchat': 'snapchat://',
      'telegram': 'tg://',
      'reddit': 'reddit://',
      'pinterest': 'pinterest://',
      'mail': 'mailto:',
      'messages': 'sms:',
      'phone': 'tel:',
      'maps': 'geo:0,0?q=',
      'settings': 'app-settings:'
    };

    function attemptOpenApp(txt) {
      // Regex to catch commands like "open youtube", "launch spotify", etc.
      const match = txt.match(/^(?:open|launch|start)\s+(.+)$/i);
      if (match) {
        const appName = match[1].toLowerCase().trim().replace(/ /g, ''); // normalize spaces
        if (APP_SCHEMES[appName]) {
           setHud("THINKING");
           toast(`Executing Deep Link: ${appName}`);
           speak(`Opening ${appName}.`);
           // Delay to allow speech to start before the browser attempts to redirect
           setTimeout(() => { 
             location.href = APP_SCHEMES[appName]; 
             setHud("STANDBY");
           }, 1500);
           return true;
        } else {
           speak(`I cannot open ${match[1]} directly from the web browser. Mobile security protocols prevent this.`);
           return true;
        }
      }
      return false;
    }

    $('chat-form').onsubmit = e => {
      e.preventDefault();
      const q = $('chat-input').value.trim();
      if (q) { 
        $('chat-input').value = ""; 
        // Intercept app commands first
        if (!attemptOpenApp(q)) {
            askEV(q); 
        }
      }
    };

    // --- 3D HOLOGRAPHIC ORB ---
    let scene, camera, renderer, core, pts, ring, base;
    const clock = new THREE.Clock();
    function init3D() {
      const box = $('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0.05, 2.5);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      box.appendChild(renderer.domElement);

      const grid = new THREE.GridHelper(6, 18, 0xff1744, 0x002b44);
      grid.position.y = -1.2; scene.add(grid);

      const geo = new THREE.IcosahedronGeometry(0.62, 3);
      base = geo.attributes.position.array.slice();
      core = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff1744, wireframe: true, transparent: true, opacity: 0.8 }));
      pts = new THREE.Points(new THREE.SphereGeometry(0.78, 24, 24), new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.028 }));
      ring = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.008, 12, 64), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
      ring.rotation.x = 1.1; scene.add(core, pts, ring);

      let drag = false, lx = 0, ly = 0, vx = 0, vy = 0;
      box.ontouchstart = e => { drag = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; };
      box.ontouchmove = e => { if (drag) { vy = (e.touches[0].clientX - lx) * 0.006; vx = (e.touches[0].clientY - ly) * 0.006; lx = e.touches[0].clientX; ly = e.touches[0].clientY; } };
      box.ontouchend = () => drag = false;

      (function loop() {
        requestAnimationFrame(loop);
        const t = clock.getElapsedTime(), sp = state === "THINKING" ? 0.035 : (state === "SPEAKING" ? 0.015 : 0.004);
        core.rotation.y += vy + sp; core.rotation.x += vx; pts.rotation.y -= vy + sp * 0.7; ring.rotation.z += 0.01;
        vx *= 0.92; vy *= 0.92;
        const pos = core.geometry.attributes.position, amp = state === "SPEAKING" ? 0.1 : 0.02;
        for (let i = 0; i < pos.count; i++) {
          const w = 1 + Math.sin(t * 9 + base[i * 3] * 5) * amp;
          pos.setXYZ(i, base[i * 3] * w, base[i * 3 + 1] * w, base[i * 3 + 2] * w);
        }
        pos.needsUpdate = true;
        core.material.color.setHex(state === "LISTENING" ? 0x00e5ff : 0xff1744);
        renderer.render(scene, camera);
      })();
    }

    // --- VOICE & AI ---
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f = 700) {
      try {
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain();
        o.connect(g); g.connect(actx.destination); o.frequency.value = f;
        g.gain.setValueAtTime(0.1, actx.currentTime); o.start(); o.stop(actx.currentTime + 0.12);
      } catch (e) {}
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SR ? new SR() : null;
    if (rec) {
      rec.continuous = true;
      rec.onresult = e => {
        const txt = e.results[e.results.length - 1][0].transcript.trim();
        
        // Check for app opening command first
        if (attemptOpenApp(txt)) return;

        if (state === "STANDBY" && /\b(ev|evie|e\.v\.)\b/i.test(txt)) {
          const q = txt.replace(/hey|evie|e\.v\.|ev/gi, "").trim();
          q.length > 2 ? askEV(q) : speak(NAME ? `Online, ${NAME}.` : "E.V. online.");
        } else if (state === "LISTENING" && txt.length > 1) {
          askEV(txt);
        }
      };
      rec.onend = () => { if (state !== "OFF" && state !== "SPEAKING") setTimeout(() => { try { rec.start(); } catch (e) {} }, 250); };
    }

    function speak(text, next = "LISTENING") {
      speechSynthesis.cancel();
      if (rec) try { rec.stop(); } catch (e) {}
      setHud("SPEAKING");
      const clean = text.replace(/```[\s\S]*?```/g, "Code displayed on screen.").replace(/[#*`_]/g, "");
      $('subtitle').innerText = `"${clean}"`;
      const u = new SpeechSynthesisUtterance(clean);
      const v = speechSynthesis.getVoices().find(x => /samantha|victoria|karen|zira|aria|female|uk/i.test(x.name));
      if (v) u.voice = v;
      u.onend = u.onerror = () => { setHud(next); if (rec) try { rec.start(); } catch (e) {} };
      speechSynthesis.speak(u);
    }

    async function callAI(sys, msgs) {
      if (!KEY || KEY.startsWith("AIza")) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${KEY.startsWith("AIza") ? KEY : ""}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: msgs.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })) })
          });
          const d = await r.json();
          if (d?.candidates?.[0]?.content?.parts?.[0]?.text) return d.candidates[0].content.parts[0].text;
        } catch (e) {}
      }
      if (KEY.startsWith("gsk_")) {
        const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + KEY },
          body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: sys }, ...msgs], max_tokens: 500 })
        });
        const d = await r.json();
        if (r.ok) return d.choices[0].message.content;
      }
      const p = await fetch("https://text.pollinations.ai/openai", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "openai", messages: [{ role: "system", content: sys }, ...msgs] })
      });
      return (await p.json()).choices[0].message.content;
    }

    async function askEV(q) {
      setHud("THINKING"); $('subtitle').innerText = `You: "${q}"`;
      const m = q.match(/(?:my name is|call me|i am|i'm)\s+([a-zA-Z]{2,18})/i);
      if (m && !/^(ready|here|fine|good|back)$/i.test(m[1])) {
        NAME = m[1][0].toUpperCase() + m[1].slice(1);
        localStorage.setItem('ev_user_name', NAME); $('name-input').value = NAME; syncTag();
      }
      const uCtx = NAME ? `User's real name is ${NAME}.` : `Do not call user Peter. Ask their real name naturally if unknown.`;
      const sys = `You are E.V., a real, live personal AI assistant (no roleplay). ${uCtx} Reply in 1-2 short sentences.${mode === "CODE" ? " Include code in ``` blocks." : ""}`;

      memory.push({ role: "user", content: q });
      if (memory.length > 6) memory = memory.slice(-6);

      try {
        const reply = await callAI(sys, memory);
        memory.push({ role: "assistant", content: reply });
        if (mode === "CODE" || reply.includes("```")) {
          $('workspace').classList.remove('hidden');
          $('workspace').innerHTML = reply.replace(/```(\w+)?([\s\S]*?)```/g, '<pre class="bg-black/80 p-2 rounded text-cyan-300 font-mono overflow-x-auto"><code>$2</code></pre>');
        }
        speak(reply.split("```")[0].trim() || "Code ready on screen.");
      } catch (e) { speak("Connection interrupted. Tap SETUP and hit FREE AI.", "STANDBY"); }
    }

    function setHud(s) {
      state = s;
      const c = s === "LISTENING" || s === "THINKING" ? "#00e5ff" : "#ff1744";
      $('status-hud').style.borderColor = $('micBtn').style.borderColor = c;
      $('dot').style.background = c; $('sub-badge').innerText = s;
      const map = { OFF: ["E.V. CORE OFFLINE", "TAP TO LINK E.V."], STANDBY: ["SAY 'HEY E.V.'", "TAP TO TALK"], LISTENING: [`LISTENING${NAME ? " TO " + NAME.toUpperCase() : ""}...`, "LISTENING..."], THINKING: ["PROCESSING...", "COMPUTING..."], SPEAKING: ["E.V. LIVE", "TAP TO INTERRUPT"] };
      [$('status-text').innerText, $('micBtn').innerText] = map[s];
    }

    $('micBtn').onclick = () => {
      beep();
      if (state === "SPEAKING") { speechSynthesis.cancel(); setHud("LISTENING"); if (rec) try { rec.start(); } catch (e) {} }
      else speak(state === "OFF" ? (NAME ? `E.V. online. Ready, ${NAME}.` : "E.V. live core online. What's your name?") : "Listening.");
    };

    window.onload = () => { init3D(); setHud("OFF"); };
    window.onresize = () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
  </script>
</body>
</html>
