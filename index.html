<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E.V. • Spider-Man Mobile AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { width: 100vw; height: 100dvh; overflow: hidden; background: #030611; color: #e2e8f0; font-family: system-ui, sans-serif; position: fixed; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; touch-action: none; }
    .hud-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at 50% 45%, transparent 30%, #030611 92%); }
  </style>
</head>
<body class="flex flex-col justify-between p-3 max-w-md mx-auto">

  <!-- 3D HOLOGRAPHIC ORB -->
  <div id="canvas-container"></div>
  <div class="hud-overlay"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-all duration-300 bg-[#050b1a]/95 border border-[#ff1744] text-cyan-200 text-[11px] font-bold px-4 py-1.5 rounded-full shadow-lg"></div>

  <!-- TOP BAR: STATUS + API KEY -->
  <header class="relative z-10 flex flex-col gap-2">
    <div class="flex items-center gap-1.5">
      <div id="status-hud" class="flex-1 bg-[#040b18]/90 border border-[#ff1744] px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-md">
        <span id="dot" class="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_8px_#ff1744]"></span>
        <span id="status-text" class="text-[11px] font-bold tracking-wider uppercase truncate">E.V. OPTICS OFFLINE</span>
      </div>
      <button id="mode-btn" class="bg-[#040b18]/90 border border-cyan-400/60 text-cyan-300 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase">PATROL</button>
      <button id="key-toggle" class="bg-[#040b18]/90 border border-[#ff1744]/70 text-[#ff1744] px-3 py-1.5 rounded-full text-[10px] font-bold uppercase">KEY</button>
    </div>

    <div id="key-bar" class="hidden flex gap-1.5 bg-[#040b18]/95 border border-cyan-500/40 p-2 rounded-xl">
      <input id="api-input" type="password" placeholder="Paste Groq Key (gsk_...)" class="flex-1 bg-black/60 border border-cyan-500/30 rounded-lg px-2.5 py-1 text-xs text-white outline-none">
      <button id="save-btn" class="bg-[#ff1744] text-white text-[10px] font-bold px-3 py-1 rounded-lg uppercase">SAVE</button>
      <button id="export-btn" class="hidden bg-cyan-500 text-black text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase">MD</button>
    </div>
  </header>

  <!-- CENTER WORKSPACE & SUBTITLES -->
  <main class="relative z-10 flex flex-col justify-end gap-2 pointer-events-none my-auto w-full">
    <div id="workspace" class="hidden pointer-events-auto max-h-[36dvh] bg-[#030916]/95 border border-[#ff1744] rounded-xl p-3 overflow-y-auto text-xs">
      <div class="flex justify-between items-center mb-1.5 pb-1 border-b border-white/10">
        <span class="text-[#ff1744] font-bold text-[11px] tracking-wider">🕸️ TACTICAL MATRIX</span>
        <button onclick="document.getElementById('workspace').classList.add('hidden')" class="text-[10px] text-cyan-300 bg-white/10 px-2 py-0.5 rounded">HIDE</button>
      </div>
      <div id="workspace-body" class="space-y-1.5 text-[11px]"></div>
    </div>

    <div class="pointer-events-auto bg-[#040b18]/85 border border-cyan-500/30 rounded-xl p-2.5 backdrop-blur-md">
      <div class="flex justify-between text-[9px] font-bold tracking-widest text-[#ff1744] uppercase mb-0.5">
        <span>SUIT MK-V // E.V. AI</span>
        <span id="sub-badge" class="text-cyan-400">STANDBY</span>
      </div>
      <p id="subtitle" class="text-xs text-slate-100 line-clamp-2">"Tap below to link mask neural optics, Peter."</p>
    </div>
  </main>

  <!-- BOTTOM CONTROLS -->
  <footer class="relative z-10 flex flex-col gap-2">
    <div class="flex gap-1.5 overflow-x-auto pb-0.5">
      <button data-q="Calibrate my web-shooter targeting matrix" class="chip shrink-0 bg-[#050d1f]/90 border border-cyan-500/40 text-cyan-300 px-2.5 py-1 rounded-full text-[10px]">🎯 Target Matrix</button>
      <button data-q="Scan Queens NYPD band for emergencies" class="chip shrink-0 bg-[#050d1f]/90 border border-[#ff1744]/40 text-rose-300 px-2.5 py-1 rounded-full text-[10px]">🚨 NYPD Scan</button>
      <button data-q="Tactical mode: write a Python web-swing physics script" class="chip shrink-0 bg-[#050d1f]/90 border border-cyan-500/40 text-cyan-300 px-2.5 py-1 rounded-full text-[10px]">💻 Swing Code</button>
    </div>

    <div class="flex gap-1.5">
      <button id="micBtn" class="flex-1 bg-gradient-to-r from-[#ff1744]/30 to-cyan-500/30 border-2 border-[#ff1744] text-white py-3 rounded-full text-xs font-bold tracking-widest uppercase shadow-[0_0_20px_rgba(255,23,68,0.3)] active:scale-95 transition">
        TAP TO LINK E.V.
      </button>
      <button id="chat-toggle" class="bg-[#050d1f] border border-cyan-400/60 text-cyan-300 px-3.5 rounded-full text-xs">⌨️</button>
    </div>

    <form id="chat-form" class="hidden flex gap-1.5">
      <input id="chat-input" type="text" placeholder="Ask E.V. anything..." class="flex-1 bg-[#040b18] border border-cyan-400/50 rounded-full px-3 py-2 text-xs text-white outline-none">
      <button class="bg-[#ff1744] text-white text-[10px] font-bold px-3.5 rounded-full uppercase">SEND</button>
    </form>
  </footer>

  <script>
    let GROQ_KEY = (localStorage.getItem('ev_groq_key') || localStorage.getItem('jarvis_groq_key') || "").trim();
    let state = "OFF", mode = "PATROL", lastOutput = "", memory = [];

    const $ = id => document.getElementById(id);
    $('api-input').value = GROQ_KEY;

    function toast(msg) {
      const t = $('toast');
      t.innerText = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2500);
    }

    $('key-toggle').onclick = () => $('key-bar').classList.toggle('hidden');
    $('chat-toggle').onclick = () => $('chat-form').classList.toggle('hidden');

    $('save-btn').onclick = () => {
      GROQ_KEY = $('api-input').value.replace(/[^a-zA-Z0-9_-]/g, "");
      localStorage.setItem('ev_groq_key', GROQ_KEY);
      $('key-bar').classList.add('hidden');
      beep(880, 0.12);
      toast("Neural Key Saved");
    };

    $('export-btn').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([lastOutput], { type: 'text/markdown' }));
      a.download = `ev_log_${Date.now()}.md`;
      a.click();
    };

    $('mode-btn').onclick = () => {
      mode = mode === "PATROL" ? "TACTICAL" : "PATROL";
      $('mode-btn').innerText = mode;
      $('workspace').classList.toggle('hidden', mode === "PATROL");
      setHud(state);
    };

    document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      if (b.dataset.q.includes("Tactical")) { mode = "TACTICAL"; $('mode-btn').innerText = mode; }
      askEV(b.dataset.q);
    });

    $('chat-form').onsubmit = e => {
      e.preventDefault();
      const q = $('chat-input').value.trim();
      if (q) { $('chat-input').value = ""; askEV(q); }
    };

    // --- 3D SPIDER-CORE ---
    let scene, camera, renderer, core, particles, ring, basePos;
    const clock = new THREE.Clock();

    function init3D() {
      const box = $('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0.05, 2.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      box.appendChild(renderer.domElement);

      const grid = new THREE.GridHelper(6, 20, 0xff1744, 0x002b44);
      grid.position.y = -1.2;
      scene.add(grid);

      const geo = new THREE.IcosahedronGeometry(0.62, 3);
      basePos = geo.attributes.position.array.slice();
      core = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff1744, wireframe: true, transparent: true, opacity: 0.8 }));
      scene.add(core);

      particles = new THREE.Points(
        new THREE.SphereGeometry(0.78, 26, 26),
        new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.028 })
      );
      scene.add(particles);

      ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.98, 0.008, 12, 80),
        new THREE.MeshBasicMaterial({ color: 0x00e5ff })
      );
      ring.rotation.x = 1.1;
      scene.add(ring);

      let drag = false, lx = 0, ly = 0, vx = 0, vy = 0;
      box.addEventListener('touchstart', e => { drag = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
      box.addEventListener('touchmove', e => {
        if (!drag) return;
        vy = (e.touches[0].clientX - lx) * 0.006;
        vx = (e.touches[0].clientY - ly) * 0.006;
        lx = e.touches[0].clientX; ly = e.touches[0].clientY;
      }, { passive: true });
      box.addEventListener('touchend', () => drag = false);

      (function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const speed = state === "THINKING" ? 0.035 : (state === "SPEAKING" ? 0.015 : 0.004);

        core.rotation.y += vy + speed;
        core.rotation.x += vx;
        particles.rotation.y -= vy + speed * 0.7;
        ring.rotation.z += 0.01;
        vx *= 0.92; vy *= 0.92;

        const pos = core.geometry.attributes.position;
        const amp = state === "SPEAKING" ? 0.1 : (state === "THINKING" ? 0.04 : 0.015);
        for (let i = 0; i < pos.count; i++) {
          const w = 1 + Math.sin(t * 9 + basePos[i * 3] * 5) * amp;
          pos.setXYZ(i, basePos[i * 3] * w, basePos[i * 3 + 1] * w, basePos[i * 3 + 2] * w);
        }
        pos.needsUpdate = true;
        core.material.color.setHex(state === "LISTENING" ? 0x00e5ff : 0xff1744);
        renderer.render(scene, camera);
      })();
    }

    // --- AUDIO & SPEECH ---
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 640, dur = 0.15) {
      try {
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain();
        o.connect(g); g.connect(actx.destination);
        o.frequency.setValueAtTime(freq, actx.currentTime);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
        o.start(); o.stop(actx.currentTime + dur);
      } catch (e) {}
    }

    function speak(text, next = "LISTENING") {
      speechSynthesis.cancel();
      if (rec) try { rec.stop(); } catch (e) {}
      setHud("SPEAKING");

      const clean = text.replace(/```[\s\S]*?```/g, "Tactical code projected on your HUD, Peter.").replace(/[#*`_]/g, "");
      $('subtitle').innerText = `"${clean}"`;

      const u = new SpeechSynthesisUtterance(clean);
      const v = speechSynthesis.getVoices().find(x => /samantha|victoria|karen|zira|aria|jenny|female|uk/i.test(x.name));
      if (v) u.voice = v;
      u.pitch = 1.1; u.rate = 1.06;
      u.onend = u.onerror = () => { setHud(next); startRec(); };
      speechSynthesis.speak(u);
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SR ? new SR() : null;
    if (rec) {
      rec.continuous = true;
      rec.onresult = e => {
        const txt = e.results[e.results.length - 1][0].transcript.trim();
        const low = txt.toLowerCase();
        if (low.includes("open whatsapp")) { location.href = "whatsapp://"; return; }
        if (low.includes("open youtube")) { location.href = "vnd.youtube://"; return; }
        if (state === "STANDBY" && /\b(ev|evie|e\.v\.|jarvis)\b/i.test(low)) {
          const q = txt.replace(/hey|evie|e\.v\.|ev|jarvis/gi, "").trim();
          q.length > 2 ? askEV(q) : speak("Optics online, Peter. What's the play?");
        } else if (state === "LISTENING" && txt.length > 1) {
          askEV(txt);
        }
      };
      rec.onend = () => { if (state !== "OFF" && state !== "SPEAKING") startRec(); };
    }

    function startRec() {
      if (!rec) return;
      setTimeout(() => { try { if (state !== "OFF" && state !== "SPEAKING") rec.start(); } catch (e) {} }, 250);
    }

    async function askEV(query) {
      if (!GROQ_KEY) {
        $('key-bar').classList.remove('hidden');
        toast("Paste your Groq Key first");
        return speak("Peter, link your Groq neural key in the top bar first.", "STANDBY");
      }
      setHud("THINKING");
      $('subtitle').innerText = `You: "${query}"`;

      const sys = mode === "TACTICAL"
        ? "You are E.V., Peter Parker's Spider-Man AI. Give a 1-sentence intro followed by complete code in ``` blocks."
        : "You are E.V. (Evie), Peter Parker's warm, witty AI in his Spider-Man: Brand New Day suit. Reply in 1-2 short spoken sentences.";

      memory.push({ role: "user", content: query });
      if (memory.length > 6) memory = memory.slice(-6);

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_KEY },
          body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "system", content: sys }, ...memory], max_tokens: 550 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || res.status);

        const reply = data.choices[0].message.content;
        memory.push({ role: "assistant", content: reply });
        lastOutput = reply;

        if (mode === "TACTICAL" || reply.includes("```")) {
          $('export-btn').classList.remove('hidden');
          $('workspace').classList.remove('hidden');
          $('workspace-body').innerHTML = reply
            .replace(/```(\w+)?([\s\S]*?)```/g, '<pre class="bg-black/80 border border-cyan-500/30 p-2 rounded-lg overflow-x-auto text-cyan-300 font-mono"><code>$2</code></pre>')
            .replace(/\n/g, "<br>");
        }
        speak(reply.split("```")[0].trim() || "Tactical code ready on your lens display, Peter.");
      } catch (err) {
        toast("Error: " + err.message.slice(0, 30));
        speak("Neural link interference, Peter. Check your API key.", "STANDBY");
      }
    }

    function setHud(s) {
      state = s;
      const c = s === "LISTENING" || s === "THINKING" ? "#00e5ff" : "#ff1744";
      $('status-hud').style.borderColor = c;
      $('dot').style.background = c;
      $('micBtn').style.borderColor = c;
      $('sub-badge').innerText = s;
      const map = {
        OFF: ["OPTICS OFFLINE", "TAP TO LINK E.V."],
        STANDBY: ["SAY 'HEY E.V.'", "STANDBY • TAP TO TALK"],
        LISTENING: ["LISTENING TO PETER...", "LISTENING..."],
        THINKING: ["CALIBRATING...", "COMPUTING..."],
        SPEAKING: ["E.V. TRANSMITTING", "TAP TO INTERRUPT"]
      };
      [$('status-text').innerText, $('micBtn').innerText] = map[s];
    }

    $('micBtn').onclick = () => {
      beep(720, 0.15);
      if (state === "SPEAKING") { speechSynthesis.cancel(); setHud("LISTENING"); startRec(); }
      else { speak(state === "OFF" ? "E.V. optics online. Targeting matrix zeroed in, Peter." : "Right here, Peter. What do you need?"); }
    };

    window.onload = () => { init3D(); setHud("OFF"); };
    window.onresize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };
  </script>
</body>
</html>
