<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E.V. AI • OS Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
    body{width:100vw;height:100dvh;overflow:hidden;background:#02050e;color:#e2e8f0;font-family:system-ui,sans-serif;position:fixed}
    #c-box{position:absolute;inset:0;z-index:1}.hud{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 25%,#02050e 95%)}
  </style>
</head>
<body class="flex flex-col justify-between p-3.5 max-w-md mx-auto">
  <div id="c-box"></div><div class="hud"></div>
  <input type="file" id="cam-bridge" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="gal-bridge" accept="image/*,video/*" class="hidden">

  <!-- HEADER -->
  <header class="relative z-10 flex flex-col gap-1.5">
    <div class="flex items-center gap-1.5">
      <div id="hud" class="flex-1 bg-[#040b18]/85 border border-[#ff1744] px-3 py-1.5 rounded-full flex items-center gap-2 backdrop-blur-md">
        <span id="dot" class="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_8px_#ff1744]"></span>
        <span id="st-txt" class="text-[10px] font-bold tracking-wider uppercase truncate">E.V. CORE OFFLINE</span>
      </div>
      <button onclick="$('key-bar').classList.toggle('hidden')" class="bg-[#040b18]/80 border border-[#ff1744]/70 text-[#ff1744] px-3 py-1.5 rounded-full text-[10px] font-bold">SETUP</button>
    </div>
    <div id="key-bar" class="hidden flex gap-1.5 bg-[#040b18]/95 border border-cyan-500/40 p-2 rounded-xl backdrop-blur-md">
      <input id="name-in" placeholder="Name" class="w-1/3 bg-black/60 border border-[#ff1744]/40 rounded-lg px-2 py-1 text-xs text-white outline-none">
      <input id="key-in" type="password" placeholder="Groq/Gemini Key" class="flex-1 bg-black/60 border border-cyan-500/40 rounded-lg px-2 py-1 text-xs text-white outline-none">
      <button onclick="save()" class="bg-[#ff1744] text-white text-[10px] font-bold px-2.5 rounded-lg">SAVE</button>
    </div>
  </header>

  <!-- WORKSPACE & SUBTITLES -->
  <main class="relative z-10 flex flex-col justify-end gap-2 pointer-events-none my-auto w-full">
    <div id="workspace" class="hidden pointer-events-auto max-h-[28dvh] bg-[#030916]/95 border border-cyan-500/40 rounded-xl p-2.5 overflow-y-auto text-[11px] font-mono text-cyan-300 whitespace-pre-wrap"></div>
    <div class="pointer-events-auto bg-[#040b18]/85 border border-cyan-500/30 rounded-xl p-2.5 backdrop-blur-md">
      <div class="flex justify-between text-[9px] font-bold tracking-widest text-[#ff1744] uppercase mb-0.5">
        <span id="u-tag">E.V. LIVE NEURAL AI</span><span id="badge" class="text-cyan-400">OFF</span>
      </div>
      <p id="sub" class="text-xs text-slate-100 line-clamp-2">"Tap below to initialize."</p>
      <a id="app-btn" href="#" class="hidden mt-2 inline-flex items-center justify-center bg-gradient-to-r from-cyan-600 to-blue-600 text-white text-xs font-bold py-2 px-3 rounded-lg w-full shadow-lg">🚀 Launch App</a>
    </div>
  </main>

  <!-- CONTROLS -->
  <footer class="relative z-10 flex flex-col gap-1.5">
    <div class="flex gap-1.5">
      <button id="mic" onclick="toggleMic()" class="flex-1 bg-gradient-to-r from-[#ff1744]/30 to-cyan-500/30 border-2 border-[#ff1744] text-white py-3 rounded-full text-xs font-bold tracking-widest uppercase active:scale-95 transition">TAP TO LINK</button>
      <button onclick="$('chat-form').classList.toggle('hidden')" class="bg-[#050d1f] border border-cyan-400/50 text-cyan-300 px-3.5 rounded-full text-xs">⌨️</button>
    </div>
    <form id="chat-form" onsubmit="event.preventDefault();askEV($('chat-in').value);$('chat-in').value='';" class="hidden flex gap-1.5">
      <input id="chat-in" placeholder="Say 'open camera', 'deep research quantum computing'..." class="flex-1 bg-[#040b18] border border-cyan-400/50 rounded-full px-3 py-1.5 text-xs text-white outline-none">
      <button class="bg-[#ff1744] text-white text-[10px] font-bold px-3 rounded-full">SEND</button>
    </form>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    let KEY = localStorage.getItem('ev_k') || "", NAME = localStorage.getItem('ev_n') || "", state = "OFF", sTimer = null;
    const isDroid = /android/i.test(navigator.userAgent);
    $('key-in').value = KEY; $('name-in').value = NAME;
    const syncTag = () => $('u-tag').innerText = NAME ? `E.V. // ${NAME.toUpperCase()}` : "E.V. SYSTEM";
    syncTag();

    function save() {
      KEY = $('key-in').value.trim(); NAME = $('name-in').value.trim();
      localStorage.setItem('ev_k', KEY); localStorage.setItem('ev_n', NAME);
      syncTag(); $('key-bar').classList.add('hidden');
    }

    // --- OS INTENTS & APP ENGINE ---
    const APPS = {
      camera: () => { $('cam-bridge').click(); return { n: "Camera" }; },
      photos: () => { $('gal-bridge').click(); return { n: "Gallery", u: isDroid ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_GALLERY;end" : "photos-redirect:" }; },
      gallery: () => APPS.photos(),
      calculator: () => ({ n: "Calc", u: isDroid ? "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_CALCULATOR;end" : "https://google.com/search?q=calculator" }),
      settings: () => ({ n: "Settings", u: isDroid ? "intent:#Intent;action=android.settings.SETTINGS;end" : "app-settings:" }),
      clock: () => ({ n: "Clock", u: isDroid ? "intent:#Intent;action=android.intent.action.SHOW_ALARMS;end" : "clock-alarm:" }),
      alarm: () => APPS.clock(), calendar: () => ({ n: "Calendar", u: isDroid ? "content://com.android.calendar/time/" : "calshow:" }),
      files: () => ({ n: "Files", u: isDroid ? "intent:#Intent;action=android.intent.action.OPEN_DOCUMENT;type=*/*;end" : "shareddocuments:" }),
      call: p => ({ n: "Dialer", u: "tel:" + (p.match(/\d+/)?.[0] || "") }), phone: p => APPS.call(p), dialer: p => APPS.call(p),
      sms: () => ({ n: "SMS", u: "sms:" }), messages: () => APPS.sms(), mail: () => ({ n: "Mail", u: "mailto:" }),
      whatsapp: p => ({ n: "WhatsApp", u: p ? `whatsapp://send?text=${encodeURIComponent(p)}` : "whatsapp://" }),
      youtube: p => ({ n: "YouTube", u: p ? `https://youtube.com/results?search_query=${encodeURIComponent(p)}` : "https://youtube.com" }),
      spotify: p => ({ n: "Spotify", u: p ? `https://open.spotify.com/search/${encodeURIComponent(p)}` : "spotify://" }),
      maps: p => ({ n: "Maps", u: p ? `https://maps.google.com/maps?q=${encodeURIComponent(p)}` : "https://maps.google.com" })
    };
    ["amazon","chrome","discord","facebook","github","gmail","instagram","linkedin","netflix","reddit","snapchat","telegram","tiktok","twitter","uber","zomato"].forEach(a => APPS[a] = () => ({ n: a, u: `${a}://` }));

    function launchApp(q) {
      const c = q.toLowerCase().replace(/^(open|launch|run|start)\s+/i,"").trim(), t = c.split(" ")[0];
      let r = null;
      for (const k in APPS) if (c.includes(k)) { r = APPS[k](c.replace(k,"").trim()); break; }
      if (!r && /^(open|launch|start|run)\b/i.test(q) && t.length > 1) r = { n: t, u: isDroid ? `intent:#Intent;package=com.${t};end` : `https://${t}.com` };
      if (!r) return false;
      speak(`Opening ${r.n}.`);
      if (r.u) {
        const b = $('app-btn'); b.href = r.u; b.innerText = `🚀 Open ${r.n}`; b.classList.remove('hidden');
        try { window.location.href = r.u; } catch(e){}
        setTimeout(() => b.classList.add('hidden'), 8000);
      }
      return true;
    }

    // --- 3D NEURAL ORB ---
    let scene, cam, ren, core, pts, base, clk = new THREE.Clock();
    function init3D() {
      scene = new THREE.Scene(); cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100); cam.position.z = 2.4;
      ren = new THREE.WebGLRenderer({ antialias: true, alpha: true }); ren.setSize(innerWidth, innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio, 2));
      $('c-box').appendChild(ren.domElement);
      const geo = new THREE.IcosahedronGeometry(0.65, 3); base = geo.attributes.position.array.slice();
      core = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff1744, wireframe: true, transparent: true, opacity: 0.8 }));
      pts = new THREE.Points(new THREE.SphereGeometry(0.8, 24, 24), new THREE.PointsMaterial({ color: 0x00e5ff, size: 0.025 }));
      scene.add(core, pts);
      (function loop() {
        requestAnimationFrame(loop);
        const t = clk.getElapsedTime(), s = state, sp = s==="THINKING"?0.04:(s==="SPEAKING"?0.02:(s==="STANDBY"?0.002:0.007));
        core.rotation.y += sp; pts.rotation.y -= sp * 0.7;
        const p = core.geometry.attributes.position, a = s==="SPEAKING"?0.12:(s==="STANDBY"?0.01:0.02);
        for(let i=0; i<p.count; i++) p.setXYZ(i, base[i*3]*(1+Math.sin(t*8+base[i*3]*4)*a), base[i*3+1]*(1+Math.sin(t*8+base[i*3]*4)*a), base[i*3+2]*(1+Math.sin(t*8+base[i*3]*4)*a));
        p.needsUpdate = true;
        const c = s==="STANDBY"?0x8b5cf6:(s==="LISTENING"||s==="THINKING"?0x00e5ff:0xff1744);
        core.material.color.setHex(c); pts.material.color.setHex(s==="STANDBY"?0xa78bfa:0x00e5ff);
        ren.render(scene, cam);
      })();
    }

    // --- STANDBY & SPEECH SYSTEM ---
    const resetTimer = () => { clearTimeout(sTimer); if (state === "LISTENING") sTimer = setTimeout(() => enterStandby(), 25000); };
    function enterStandby(notify = true) {
      clearTimeout(sTimer); setHud("STANDBY"); $('sub').innerText = '"Standby mode. Say \'Wake up\' or tap to link."';
      if (notify) { const u = new SpeechSynthesisUtterance("Standing by."); u.onend = () => recStart(); speechSynthesis.speak(u); }
    }
    function wakeUp() { setHud("LISTENING"); speak(NAME ? `Ready, ${NAME}.` : "Online and listening."); }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = SR ? new SR() : null;
    const recStart = () => { if (rec && state !== "OFF" && state !== "SPEAKING") try { rec.start(); } catch(e){} };
    if (rec) {
      rec.continuous = true;
      rec.onresult = e => {
        const q = e.results[e.results.length - 1][0].transcript.trim();
        if (state === "STANDBY") { if (/wake up|activate|online|hey ev|ev/i.test(q)) wakeUp(); return; }
        askEV(q);
      };
      rec.onend = () => recStart();
    }

    function speak(txt, nextState = "LISTENING") {
      speechSynthesis.cancel(); clearTimeout(sTimer); if (rec) try { rec.stop(); } catch(e){}
      setHud("SPEAKING"); const clean = txt.replace(/```[\s\S]*?```/g, "Code on screen.").replace(/[#*`_]/g, "");
      $('sub').innerText = `"${clean}"`;
      const u = new SpeechSynthesisUtterance(clean);
      u.onend = u.onerror = () => { setHud(nextState); recStart(); resetTimer(); };
      speechSynthesis.speak(u);
    }

    // --- AI CORE & ROBUST DEEP RESEARCH ---
    async function callAI(sys, q) {
      if (KEY.startsWith("AIza")) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: `${sys}\nUser: ${q}` }] }] })
          });
          const d = await r.json();
          if (d?.candidates?.[0]?.content?.parts?.[0]?.text) return d.candidates[0].content.parts[0].text;
        } catch(e){}
      }
      if (KEY.startsWith("gsk_")) {
        try {
          const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: sys }, { role: "user", content: q }], max_tokens: 1200 })
          });
          const d = await r.json();
          if (d?.choices?.[0]?.message?.content) return d.choices[0].message.content;
        } catch(e){}
      }
      // Direct POST API avoiding URL length limits
      const res = await fetch("https://text.pollinations.ai/", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: [{ role: "system", content: sys }, { role: "user", content: q }], model: "openai" })
      });
      return await res.text();
    }

    async function deepResearch(topic) {
      setHud("THINKING"); $('sub').innerText = `Conducting Deep Research: "${topic}"...`;
      speak(`Initiating deep research on ${topic}. Mining intelligence.`, "THINKING");
      let ctx = "";
      try {
        const w = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(topic)}&utf8=&format=json&origin=*`)).json();
        ctx = w?.query?.search?.slice(0, 3).map(s => s.snippet.replace(/<[^>]+>/g, '')).join(". ") || "";
      } catch(e){}
      const sys = `You are E.V. Deep Research Agent. Build an exhaustive dossier on: "${topic}". Telemetry Context: "${ctx}". Output structured sections:
# DOSSIER: ${topic.toUpperCase()}
## 1. EXECUTIVE SUMMARY
## 2. CORE ANALYSIS & ARCHITECTURE
## 3. IMPLICATIONS & CURRENT STATE
## 4. FUTURE HORIZON
Conclude with [BRIEFING] followed by a 2-sentence summary for vocal briefing.`;
      try {
        const d = await callAI(sys, topic);
        $('workspace').classList.remove('hidden');
        $('workspace').innerText = d.replace(/\[BRIEFING\][\s\S]*$/i, "").trim();
        const briefing = d.match(/\[BRIEFING\]\s*([\s\S]*)/i)?.[1]?.trim() || `Deep research dossier on ${topic} compiled and active in workspace.`;
        speak(briefing);
      } catch(e) {
        speak("Deep research telemetry failed. Please check network link.");
      }
    }

    async function askEV(q) {
      if (!q) return; clearTimeout(sTimer);
      if (/standby|go to sleep|sleep mode/i.test(q)) { enterStandby(true); return; }
      const r = q.toLowerCase().match(/(?:deep\s+research|research|deep\s+dive)(?:\s+(?:on|about|into))?\s+(.+)/i);
      if (r) { deepResearch(r[1]); return; }
      if (launchApp(q)) return;
      setHud("THINKING"); $('sub').innerText = `You: "${q}"`;
      try {
        const ans = await callAI(`You are E.V. assistant. User: ${NAME || "friend"}. 1-2 concise sentences. Code in markdown.`, q);
        if (ans.includes("```")) { $('workspace').classList.remove('hidden'); $('workspace').innerText = ans.match(/```(?:\w+)?([\s\S]*?)```/)[1] || ans; }
        speak(ans.split("```")[0].trim());
      } catch(e) { speak("Neural link interrupted. Tap setup."); }
    }

    function setHud(s) {
      state = s; const c = s==="STANDBY"?"#8b5cf6":(s==="LISTENING"||s==="THINKING"?"#00e5ff":"#ff1744");
      $('hud').style.borderColor = $('mic').style.borderColor = $('dot').style.backgroundColor = c;
      $('badge').innerText = s; $('badge').style.color = c;
      $('st-txt').innerText = s==="OFF"?"E.V. CORE OFFLINE":(s==="STANDBY"?"E.V. STANDBY":(s==="SPEAKING"?"E.V. LIVE":s));
      $('mic').innerText = s==="OFF"?"TAP TO LINK":(s==="STANDBY"?"WAKE UP":(s==="SPEAKING"?"INTERRUPT":"LISTENING..."));
    }

    function toggleMic() {
      if (state === "STANDBY") wakeUp();
      else if (state === "SPEAKING") { speechSynthesis.cancel(); setHud("LISTENING"); recStart(); resetTimer(); }
      else if (state === "OFF") speak(NAME ? `Online, ${NAME}.` : "E.V. system online.");
      else { setHud("LISTENING"); recStart(); resetTimer(); }
    }

    window.onload = () => { init3D(); setHud("OFF"); };
    window.onresize = () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); };
  </script>
</body>
</html>
